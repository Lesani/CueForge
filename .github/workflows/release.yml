# Build the CueForge binaries and publish them as a GitHub Release.
#
# Trigger: push a version tag, e.g.
#   git tag v0.2.0 && git push origin v0.2.0
# The tag must match cueforge.__version__ (and pyproject.toml) or the build
# fails -- the in-app updater compares that version against the release tag.
#
# Assets: one self-contained binary per supported platform (ffmpeg/yt-dlp are
# downloaded by the app itself on first use) plus a single SHA256SUMS.txt
# covering all of them, which the in-app updater verifies its download against.
#
# The Linux binaries are built on 22.04 rather than latest on purpose: a
# PyInstaller bundle links against the build machine's glibc and will not start
# on anything older, so the oldest supported runner sets the compatibility floor
# (glibc 2.35 -- Ubuntu 22.04+, Debian 12+, Fedora 36+).

name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.asset }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false # report every platform's failure, not just the first
      matrix:
        include:
          - os: windows-latest
            asset: CueForge.exe
          - os: ubuntu-22.04
            asset: CueForge-linux-x86_64
          - os: ubuntu-22.04-arm
            asset: CueForge-linux-aarch64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # sounddevice publishes no Linux wheel carrying PortAudio, so the build
      # bundles the system copy (see build_exe.py) and needs it installed here.
      - name: Install PortAudio (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libportaudio2

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Verify tag matches package version
        shell: python
        env:
          TAG: ${{ github.ref_name }}
        run: |
          import os, tomllib
          import cueforge
          tag = os.environ["TAG"].lstrip("vV")
          pkg = cueforge.__version__
          with open("pyproject.toml", "rb") as fh:
              toml = tomllib.load(fh)["project"]["version"]
          if tag != pkg:
              raise SystemExit(f"Tag v{tag} does not match cueforge.__version__ ({pkg})")
          if tag != toml:
              raise SystemExit(f"Tag v{tag} does not match pyproject.toml version ({toml})")
          print(f"version {tag} OK")

      - name: Provision ffmpeg (required by the test suite)
        run: python -c "from cueforge import ffmpeg_util; print(ffmpeg_util.download_ffmpeg())"

      - name: Run tests
        run: pytest

      - name: Build ${{ matrix.asset }}
        run: python build_exe.py

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download every platform's binary
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # One listing for the whole release, in sha256sum format. The updater
      # looks up its own platform's line by asset name.
      - name: Generate checksums
        working-directory: dist
        run: |
          sha256sum CueForge* | tee SHA256SUMS.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
